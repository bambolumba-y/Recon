name: Recon Android

on:
  push:
    branches: [recon/main, recon/stage2]
  workflow_dispatch:

concurrency:
  group: recon-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Download Recon core
        run: |
          mkdir -p android/app/libs
          CORE_VERSION=$(tr -d '\r' < dependencies.properties | sed -n 's/^core.version=//p')
          curl -fL "https://github.com/bambolumba-y/recon-core/releases/download/v${CORE_VERSION}/hiddify-lib-android.tar.gz" | tar xz -C android/app/libs/
          ls -la android/app/libs

      - name: Generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: recon-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
