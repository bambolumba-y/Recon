name: Recon Android

on:
  push:
    branches: [recon/main, recon/stage2]
  workflow_dispatch:

concurrency:
  group: recon-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: stable
          cache: true

      - name: Download Recon core
        run: |
          mkdir -p android/app/libs
          CORE_VERSION=$(tr -d '\r' < dependencies.properties | sed -n 's/^core.version=//p')
          RELEASE_URL="https://github.com/bambolumba-y/recon-core/releases/download/v${CORE_VERSION}"
          curl -fL "${RELEASE_URL}/hiddify-lib-android.tar.gz" -o hiddify-lib-android.tar.gz
          curl -fL "${RELEASE_URL}/SHA256SUMS" -o SHA256SUMS
          grep -q ' hiddify-lib-android.tar.gz$' SHA256SUMS || { echo "archive not listed in SHA256SUMS" >&2; exit 1; }
          sha256sum -c --ignore-missing SHA256SUMS
          tar xz -C android/app/libs/ -f hiddify-lib-android.tar.gz
          rm -f hiddify-lib-android.tar.gz SHA256SUMS
          ls -la android/app/libs

      - name: Generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Test
        run: flutter test

      - name: Prepare signing
        env:
          KEYSTORE_B64: ${{ secrets.RECON_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RECON_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RECON_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RECON_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "RECON_KEYSTORE_BASE64 is empty, refusing to fall back to a debug-signed build" >&2
            exit 1
          fi
          # storeFile is read by android/app/build.gradle, which resolves a
          # bare filename against the app module directory (android/app).
          echo "$KEYSTORE_B64" | base64 -d > android/app/recon-release.jks
          {
            echo "storeFile=recon-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Verify signature
        run: |
          BUILD_TOOLS_VERSION=$(ls "$ANDROID_HOME/build-tools" | tail -1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          CERT_INFO=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          if echo "$CERT_INFO" | grep -qi 'CN=Android Debug'; then
            echo "APK is signed with the debug certificate, expected the release key (CN=Recon)" >&2
            exit 1
          fi
          echo "$CERT_INFO" | grep -i 'SHA-256'

      - uses: actions/upload-artifact@v4
        with:
          name: recon-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
